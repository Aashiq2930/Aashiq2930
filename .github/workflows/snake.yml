name: Generate Tokyo Night Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Aashiq2930
          outputs: dist/github-contribution-grid-snake.svg
          snake_color: "#7aa2f7"
          color_snake: "#bb9af7"
          background: "transparent"

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
